<aside>교과서 86쪽, 수학Ⅱ를 학습한 학생을 위한 심화 내용. 공대생에게는 필수 내용으로 다룸. 곡선 아래 넓이를 가는 직사각형으로 쪼개 더한 극한이 정적분. 따라서 P(a ≤ X ≤ b)는 f를 a부터 b까지 적분한 값. 직사각형 하나의 넓이 f(x)Δx가 "x 근처 작은 구간의 확률"이라는 해석이 확률밀도의 의미. 이후 정규분포, 지수분포 모두 이 식으로 확률 계산.</aside>
