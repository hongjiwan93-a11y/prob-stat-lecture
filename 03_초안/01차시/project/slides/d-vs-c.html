<section id="d-vs-c" style="background:#EDF1F6;color:#1F2A44;font-family:'Noto Sans KR', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">

<h2 style="font-family:'IBM Plex Sans KR', Arial, sans-serif;font-size:64px;font-weight:700;line-height:1.15">막대의 길이 vs 곡선 아래 넓이</h2>
</div>
<div style="display:flex;gap:48px">
<div style="flex:1;background:#FDFCF9;border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:24px;align-items:center">
<p style="font-size:36px;font-weight:700;color:#2F6DB5;align-self:start">이산확률변수</p>
<svg aria-label="막대그래프에서 막대 하나가 주황색으로 강조된 그림" width="680" height="320" viewBox="0 0 680 320"><line x1="20" y1="280" x2="660" y2="280" stroke="#1F2A44" stroke-width="3"/><g stroke="#2F6DB5" stroke-width="14" stroke-linecap="round"><line x1="100" y1="280" x2="100" y2="200"/><line x1="220" y1="280" x2="220" y2="110"/><line x1="460" y1="280" x2="460" y2="140"/><line x1="580" y1="280" x2="580" y2="230"/></g><line x1="340" y1="280" x2="340" y2="60" stroke="#D9661F" stroke-width="18" stroke-linecap="round"/><text x="380" y="80" font-family="sans-serif" font-size="30" font-weight="700" fill="#B4531A">P(X = x)</text></svg>

<svg aria-label="곡선 아래 a부터 b까지의 넓이가 주황색으로 색칠된 그림" width="680" height="320" viewBox="0 0 680 320"><defs><clipPath id="dv"><rect x="280" y="0" width="140" height="320"/></clipPath></defs><path d="M20 280 C200 280 230 50 340 50 C450 50 480 280 660 280 Z" fill="#DCE7F5"/><path d="M20 280 C200 280 230 50 340 50 C450 50 480 280 660 280 Z" fill="#D9661F" clip-path="url(#dv)"/><path d="M20 280 C200 280 230 50 340 50 C450 50 480 280 660 280" fill="none" stroke="#2F6DB5" stroke-width="5"/><line x1="0" y1="280" x2="680" y2="280" stroke="#1F2A44" stroke-width="3"/><g font-family="sans-serif" font-size="30" font-style="italic" fill="#1F2A44" text-anchor="middle"><text x="280" y="314">a</text><text x="420" y="314">b</text></g><text x="470" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#B4531A">P(a ≤ X ≤ b)</text></svg>

<p style="position:absolute;left:128px;bottom:64px;width:1200px;font-size:24px;color:#6B7280">1차시 확률변수와 확률분포</p>
<p style="position:absolute;right:128px;bottom:64px;width:200px;font-size:24px;color:#6B7280;text-align:right">15</p>
<aside>오늘 수업에서 가장 중요한 비교. 이산확률변수는 값 하나하나에 확률이 붙고, 그 확률이 막대의 길이. 연속확률변수는 값 하나에 확률을 줄 수 없고, 구간에 대해서만 확률을 말하며, 그 확률이 곡선 아래 넓이. 곡선의 높이 f(x)는 확률이 아니라 "확률의 밀도"라는 점 강조. 그래서 f(x)가 1보다 큰 것도 가능.</aside>
